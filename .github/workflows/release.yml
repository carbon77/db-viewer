name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the vX.Y.Z format"
          }
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $manifestVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tagVersion -ne $manifestVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $manifestVersion"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI installer
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo wix --no-build --target-bin-dir target/release --nocapture

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $tag = $env:GITHUB_REF_NAME
          $exeName = "db-viewer-$tag-windows-x86_64.exe"
          $msiName = "db-viewer-$tag-windows-x86_64.msi"
          Copy-Item target/release/rust-db-viewer.exe "dist/$exeName"
          $msi = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI artifact was not created" }
          Copy-Item $msi.FullName "dist/$msiName"
          Get-ChildItem dist/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          dist/*
          --verify-tag
          --generate-notes
          --title $env:GITHUB_REF_NAME
