[package]
name = "rust-db-viewer"
version = "0.1.0"
edition = "2024"
description = "A native, read-only SQLite and PostgreSQL database viewer for Windows"
license = "MIT"
repository = "https://github.com/carbon77/db-viewer"
readme = "README.md"
keywords = ["sqlite", "postgresql", "database", "viewer", "egui"]
categories = ["database", "gui"]

[dependencies]
crossbeam-channel = "0.5"
bytes = "1"
csv = "1.3"
directories = "6"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.32"
log = "0.4"
env_logger = "0.11"
fallible-iterator = "0.2"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
